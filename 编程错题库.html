<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏆 我的编程错题库</title>
<!-- ============================================================
     我的编程错题库
     ★ 流程:孩子先自己总结错因 → 把「题目+代码+孩子总结」发给 AI(点「🤖 AI 分析提示词」)
        → AI 判断纠正并整理成 JSON → 点「📥 录入」粘贴入库。
     ★ 换电脑 / 备份:点「📄 导出HTML」下载一个把题目烤进去的文件,带走它。
        —— localStorage 不会跟着文件走,一定要用导出的文件转移!
     ★ 导出的文件在别的电脑打开,题目都在;可继续加、再导出。
     ============================================================ -->
<style>
  :root{
    --bg:#0a0f1e; --bg2:#111827; --bg3:#1f2937;
    --accent:#38bdf8; --accent2:#a78bfa; --accent3:#34d399;
    --text:#e5e7eb; --muted:#9ca3af; --danger:#f87171;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; padding:32px 20px 60px;
    background:var(--bg); color:var(--text);
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    font-size:17px; line-height:1.8;
  }
  .wrap{max-width:920px; margin:0 auto;}
  .head{display:flex; align-items:flex-start; gap:14px; flex-wrap:wrap;}
  h1{
    font-size:30px; margin:0 0 4px; flex:1;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .sub{color:var(--muted); font-size:15px; margin-bottom:22px;}
  .btn{
    cursor:pointer; border:1px solid #374151; border-radius:9px;
    padding:9px 15px; font-size:15px; font-family:inherit;
    background:var(--bg3); color:var(--text); white-space:nowrap;
  }
  .btn:hover{border-color:var(--accent);}
  .btn.primary{background:linear-gradient(90deg,var(--accent),var(--accent2)); color:#08111f; border:none; font-weight:700;}
  .btn.mini{padding:5px 11px; font-size:13px;}

  /* ---------- 筛选工具条 ---------- */
  .toolbar{
    background:var(--bg2); border-radius:14px; padding:18px 20px;
    box-shadow:0 6px 30px rgba(0,0,0,.45); margin-bottom:22px;
  }
  .rowf{display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin:8px 0;}
  .rowf .label{color:var(--muted); font-size:14px; min-width:64px;}
  input[type=text], input[type=date], select, textarea{
    background:var(--bg3); color:var(--text); border:1px solid #374151;
    border-radius:8px; padding:8px 12px; font-size:15px; font-family:inherit;
  }
  #q{flex:1; min-width:180px;}
  .chip{
    cursor:pointer; user-select:none;
    background:var(--bg3); color:var(--muted);
    border:1px solid #374151; border-radius:999px;
    padding:4px 13px; font-size:14px; transition:.15s;
  }
  .chip:hover{border-color:var(--accent);}
  .chip.on{background:rgba(56,189,248,.16); color:var(--accent); border-color:var(--accent); font-weight:600;}
  .chip.all.on{background:rgba(167,139,250,.18); color:var(--accent2); border-color:var(--accent2);}
  .count{color:var(--muted); font-size:14px; margin-left:auto;}

  /* ---------- 卡片 ---------- */
  .card{
    background:var(--bg2); border-radius:14px; padding:22px 26px;
    box-shadow:0 6px 30px rgba(0,0,0,.4); margin-bottom:18px;
    border:1px solid transparent; transition:.15s;
  }
  .card:hover{border-color:#374151;}
  .card .top{display:flex; align-items:flex-start; gap:12px; cursor:pointer;}
  .card h2{font-size:21px; margin:0; color:var(--accent); flex:1; border:none; padding:0;}
  .badge{font-size:13px; padding:2px 10px; border-radius:6px; white-space:normal; max-width:52%; line-height:1.5; border:1px solid; margin-top:3px;}
  .b-wa{color:var(--danger); border-color:var(--danger); background:rgba(248,113,113,.12);}
  .b-tle{color:#fbbf24; border-color:#fbbf24; background:rgba(251,191,36,.12);}
  .b-other{color:var(--accent2); border-color:var(--accent2); background:rgba(167,139,250,.12);}
  .cmeta{color:var(--muted); font-size:14px; margin:8px 0 6px;}
  .tags{display:flex; flex-wrap:wrap; gap:7px; margin:6px 0;}
  .tag-s{background:var(--bg3); color:var(--accent); border:1px solid #2b3a4d; border-radius:6px; padding:1px 9px; font-size:13px;}
  .comment{border-left:4px solid var(--accent3); background:var(--bg3); padding:10px 15px; border-radius:8px; margin:12px 0 0; color:#d1fae5; font-size:15px;}
  .kidref{border-left:4px solid var(--accent2); background:rgba(167,139,250,.10); padding:12px 16px; border-radius:8px; margin:8px 0 4px; color:#e9d5ff;}
  .kidref .t{color:var(--accent2); font-weight:700; display:block; margin-bottom:4px;}
  .cardfoot{display:flex; align-items:center; gap:14px; margin-top:12px;}
  .toggle{color:var(--accent); font-size:14px; cursor:pointer; user-select:none;}
  .toggle:hover{text-decoration:underline;}
  .del{color:var(--danger); font-size:13px; cursor:pointer; margin-left:auto;}
  .del:hover{text-decoration:underline;}

  /* ---------- 详情 ---------- */
  .detail{display:none; margin-top:8px; border-top:1px solid #374151; padding-top:6px;}
  .detail.open{display:block;}
  .detail h3.sec{font-size:18px; margin:26px 0 10px; padding-bottom:6px; border-bottom:1px solid #374151; color:var(--accent);}
  .detail .err h4{font-size:16px; margin:18px 0 6px; color:var(--danger);}
  ul{margin:8px 0; padding-left:22px;} li{margin:5px 0;}
  ol{padding-left:22px;} ol li{margin:7px 0;}
  code,pre{font-family:"SF Mono",Consolas,Monaco,monospace; background:var(--bg3); border-radius:6px;}
  code{padding:2px 7px; font-size:14px; color:var(--accent3);}
  pre{padding:14px 16px; overflow-x:auto; font-size:14px; line-height:1.6; color:#e5e7eb; margin:8px 0; white-space:pre-wrap;}
  table{width:100%; border-collapse:collapse; margin:12px 0;}
  th,td{border:1px solid #374151; padding:9px 12px; text-align:left; font-size:15px;}
  th{background:var(--bg3); color:var(--accent);}
  .ok{color:var(--accent3); font-weight:600;}
  .hl{color:var(--accent);}
  .tag-step{display:inline-block; background:var(--bg3); color:var(--accent); border:1px solid var(--accent); border-radius:6px; padding:1px 8px; font-size:13px; margin-right:6px;}
  .oneliner{border-left:4px solid var(--accent3); background:var(--bg3); padding:12px 16px; border-radius:8px; margin:12px 0 0; color:#d1fae5;}
  .empty{color:var(--muted); text-align:center; padding:40px 0;}

  /* ---------- 弹窗表单 ---------- */
  .mask{display:none; position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:50; padding:30px 16px; overflow:auto;}
  .mask.open{display:block;}
  .modal{max-width:760px; margin:0 auto; background:var(--bg2); border-radius:16px; padding:28px 30px; box-shadow:0 20px 60px rgba(0,0,0,.6);}
  .modal h2{margin:0 0 6px; color:var(--accent2); font-size:23px;}
  .modal .tip{color:var(--muted); font-size:14px; margin-bottom:18px;}
  .fld{margin:14px 0;}
  .fld label{display:block; color:var(--accent); font-size:14px; margin-bottom:5px;}
  .fld .hint{color:var(--muted); font-size:12.5px; font-weight:400;}
  .fld input, .fld textarea, .fld select{width:100%;}
  .fld textarea{min-height:64px; line-height:1.6; resize:vertical;}
  .two{display:flex; gap:14px; flex-wrap:wrap;}
  .two > .fld{flex:1; min-width:180px;}
  .errblock{border:1px solid #374151; border-radius:10px; padding:14px 16px; margin:12px 0; background:var(--bg);}
  .errblock .eh{display:flex; align-items:center; margin-bottom:8px;}
  .errblock .eh b{color:var(--danger); flex:1;}
  .modal .actions{display:flex; gap:12px; margin-top:22px; justify-content:flex-end;}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div style="flex:1;min-width:200px;">
      <h1>🏆 我的编程错题库</h1>
      <div class="sub">点知识点标签 / 选结果 / 搜关键词筛选;点标题看完整复盘。</div>
    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;">
      <button class="btn primary" id="addBtn">📥 录入(粘贴 AI 结果)</button>
      <button class="btn" id="exportBtn" title="把所有题目烤进一个新文件,带去别的电脑用">📄 导出HTML</button>
      <button class="btn" id="importBtn" title="从导出的 HTML 或 JSON 里导入题目">⬆ 导入</button>
      <button class="btn" id="aiBtn" title="复制一段提示词,发给 AI 让它分析错因并生成可导入的题目">🤖 AI 分析提示词</button>
    </div>
  </div>

  <div class="toolbar">
    <div class="rowf">
      <span class="label">🔍 搜索</span>
      <input type="text" id="q" placeholder="搜题名、知识点、内容…">
      <select id="sort">
        <option value="desc">时间:最新优先</option>
        <option value="asc">时间:最早优先</option>
      </select>
      <select id="result">
        <option value="">全部结果</option>
        <option value="WA">WA</option>
        <option value="TLE">TLE</option>
        <option value="RE">RE</option>
        <option value="其他">其他</option>
      </select>
    </div>
    <div class="rowf">
      <span class="label">🏷 知识点</span>
      <div id="tagbar" style="display:flex;flex-wrap:wrap;gap:10px;flex:1;"></div>
      <span class="count" id="count"></span>
    </div>
  </div>

  <div id="list"></div>
</div>

<!-- 隐藏的导入文件选择器 -->
<input type="file" id="importFile" accept=".html,.json,.txt" style="display:none;">

<script id="data">
const SEED_PROBLEMS = [

  {

    title: "宝箱(枚举所选最大值 · 最大单值不等于最大总和)",
    date: "2026-08-14",
    source: "GESP 2024 年 6 月 四级 · 宝箱",
    result: "AC(过程:固定全部宝箱的最大值,仍有 2 个测试点 WA → 枚举每个 a[i] 作为所选最大值 → AC)",
    tags: ["枚举", "双重循环", "区间求和", "最大值", "建模", "变量含义", "反例自测", "WA"],
    kidReflection: "我认为总价值里必须有最大值,但其实可以不包含,最大值不代表总最大。后来我分清了:x 是最佳方案里选中宝箱的最高值,我这个地方的 ma 是全部宝箱中单个的最大值。下次把这个区别写下来。",
    comment: "孩子最后抓住了这道题最关键的区别:<b>单个宝箱价值最大,不等于一批宝箱的总价值最大</b>。原代码不是循环或边界写错,而是在建模时先做了一个没有证明的假设:最优方案一定包含全部宝箱中的最大值。反例 <code>5,3,3,k=0</code> 很快拆掉了这个假设:拿 <code>5</code> 的总和是 5,不拿它、拿两个 <code>3</code> 的总和是 6。她开始时仍坚持必须拿 5,后来通过亲手比较两种拿法才真正反应过来,这说明<b>最小反例比重复讲定义更能帮助她修正模型</b>。<br><br>更深一层,她一度混淆了三个不同的量:① 全部宝箱中单个价值的最大值;② 当前选中宝箱中的最大值 <code>x</code>;③ 题目要求的最大总价值。改对后的双重循环已经能枚举每个 <code>a[i]</code> 作为候选 <code>x</code>,再累加区间 <code>[x-k,x]</code> 内的所有宝箱,逻辑和复杂度都满足本题范围。仍值得改进的是变量 <code>ma</code> 在 AC 代码里先表示“全局最大单值”,后又表示“目前最大总和”,一个变量承担了两个角色;虽然本题碰巧不影响结果,但会加重概念混淆。以后最好用不同名字分别表示候选最大值、当前方案总和和最终答案。",
    rules: [

      "所选集合的最大值 <code>x</code> 一定等于某个实际存在的 <code>a[i]</code>,因此可以逐个尝试每个 <code>a[i]</code> 作为候选 <code>x</code>。",
      "固定候选 <code>x</code> 后,因为宝箱价值全为正数,凡是满足 <code>x-k&lt;=a[j]&lt;=x</code> 的宝箱都应加入当前总和。"
    ],
    rulesSummary: "枚举每个宝箱价值作为“本轮所选集合的最大值 x”,累加价值落在 [x-k,x] 内的所有宝箱,再取各轮总和的最大值。n<=1000,双重循环约 10^6 次可以通过。",

        consequence: "程序只能考虑“包含全局最大值”的方案,会漏掉“不拿最大宝箱,但能拿更多较小宝箱、总和反而更大”的方案。",
        cause: "把“全部宝箱中单个价值最大”误当成“最优选择中必须出现”,没有先区分单个最大值、所选集合最大值和最终总和。",
        fix: "不要把 <code>x</code> 固定为全局最大值。逐个尝试每个 <code>a[i]</code> 作为本轮候选 <code>x</code>,对每一轮重新计算可选宝箱的总和,最后比较所有候选方案。"
      },
      {
        title: "固定候选 x 后,还要保证加入的宝箱不大于 x",

        consequence: "一旦加入大于 <code>x</code> 的宝箱,这一批宝箱的最大值就不再是当前假设的 <code>x</code>,本轮模型自相矛盾。",
        cause: "把差值限制和 <code>x</code> 的定义混在一起;是否满足 <code>k</code> 不会改变“拿入 5 后最大值就是 5”这个事实。",

      {

        consequence: "本题因为所有价值为正、最优总和不会小于全局最大单值,所以仍能 AC;但变量含义中途改变,会让证明和调试变困难。",
        cause: "修改算法后保留了旧代码和旧变量,没有重新做变量登记。",
        fix: "一个变量只做一件事。修改思路后重新写变量登记表:候选最大值、当前方案总和、最终最大总和分别用含义清楚的变量表示;已经无用的“先求全局最大值”步骤可以删掉。"
      }

      output: "6",

    shortcomings: [
      ["把局部最大当成整体最优", "看到“最大总价值”就先锁定了单个最大宝箱,没有证明最优方案必须包含它。"],
      ["变量对象范围不清", "没有及时区分“全部宝箱的最大值”“所选宝箱的最大值 x”和“所选宝箱的总价值”。"],
      ["缺少主动反例", "如果提交前用“一个较大的值 vs 多个相同的较小值”测试,可以在本地发现原假设不成立。"],
      ["变量单一职责不稳", "AC 版本的 <code>ma</code> 先存最大单值,后存最大总和,含义中途改变。"]

    checklist: [
      ["建模", "题目出现多个“最大”时,先写清楚对象:是单个元素、所选集合,还是最终总和。"],
      ["验证假设", "凡是想到“最优方案一定包含某个元素”,先问一句“为什么一定”,并造一个不包含它的方案比较。"],
      ["写码", "枚举候选 <code>x</code> 时,检查加入的值同时满足 <code>x-k&lt;=a[j]&lt;=x</code>。"],

  {

        consequence: "读到内存垃圾值,有时恰好等于 'G'、有时不等 → flag 被错误置 0 → 漏计,答案时对时错,所以是 WA 不是全错。",

      {

    ],

      output: "3",
      waBehavior: "三格本应全「没被监视」(答案 3),越界读到的垃圾若恰好是 'G' 就误判为被监视,输出成 2 甚至更小。错在没边界检查的 <code>if(s[j]=='G')</code>。"
    },
    shortcomings: [
      ["下标边界意识弱", "只想「要看哪些格子」,没想「这些位置是否真实存在」。"],

      ["读题", "先圈出数据范围和下标范围(本题下标只在 0..M-1)。"],
      ["想清楚", "凡是用变量当下标(s[j]),先问:会不会 &lt;0 或 ≥长度?"],
      ["写码", "访问数组/字符串前,养成「先判断下标合法,再读值」。"],

      ["调 bug", "WA 不要重写,先拿小例子手算,对照程序哪步开始不同。"]
    ],
    oneLiner: "用变量当下标读数组前,永远先问一句:<b>「这个位置真的存在吗?」</b>——越界读到的垃圾值,是最会骗人的 bug。"
  },

  {
    id: "scholarship",
    title: "奖学金(结构体多关键字排序)",
    date: "2026-07-24",
    source: "10483 / 洛谷 P1093 同类",
    result: "WA",
    tags: ["排序", "多关键字排序", "结构体", "冒泡排序", "交换条件"],
    comment: "这道题一个人踩了 4 个坑,而且层层递进。能靠自己一个个爬出来,比一次做对更有价值。这是一道「满分错题」。",

      },
      {
        title: "漏了第 3 条排序规则",
        phenomenon: "只实现「按总分」「按语文」,忘了「总分语文都同 → 学号小的在前」。",

      {

      },
      {
        title: "交换忘了带「条件」(无条件交换)",
        phenomenon: "<code>else if(yw==)</code> 里直接交换,没比学号 → 2 号和 6 号顺序反了。",
        consequence: "完全并列时顺序全靠碰运气。",

      }
    ],
    reviewCase: {
      input: "8\n80 89 89\n88 98 78\n90 67 80\n87 66 91\n78 89 91\n88 99 77\n67 89 64\n78 89 98",
      key: "学号 <span class='hl'>2</span> 和 <span class='hl'>6</span>,总分都是 264、语文都是 88 —— 完全并列。按第 3 条,学号小的 2 号应排在 6 号前。",
      output: "8 265\n2 264   ← 2 号在前\n6 264   ← 6 号在后\n1 258\n5 258",
      waBehavior: "WA 版本会把 2 号、6 号顺序输反(因为「无条件交换」)。"
    },
    shortcomings: [
      ["需求不拆解", "3 条规则漏了 1 条。"],
      ["不会造数据自测", "每次都靠 OJ 的 WA 才发现问题。"],
      ["调试靠猜不靠追踪", "出错先想重写,而不是手动模拟数据流动。"],

    ],
    checklist: [
      ["读题", "把所有规则/边界写成编号清单。"],
      ["对齐方向", "先确认「输出从数组哪头读」,再定排序方向。"],
      ["写码", "结构体整体交换;每个 swap 前都问「我判断了吗?」"],
      ["自测", "提交前造 2~3 组卡自己的数据,专攻「相等 / 完全并列」。"],
      ["调 bug", "WA 先拿纸笔手动模拟,追踪变量,再动手改。"]
    ],
    oneLiner: "多关键字排序不是「比几个字段」这么简单 —— 要想清楚从哪头输出、每次交换都得有明确条件,一个都不能少。"

<script>
/* ============================================================
   数据层:全部题目 = 种子(SEED) + 本地新增(localStorage)
   ============================================================ */
const LS_KEY = 'cuoti_extras_v1';
function loadExtras(){
  try { return JSON.parse(localStorage.getItem(LS_KEY) || '[]'); }
  catch(e){ return []; }
}
function saveExtras(arr){ localStorage.setItem(LS_KEY, JSON.stringify(arr)); }
function getAll(){ return SEED_PROBLEMS.concat(loadExtras()); }

/* ============================================================
   渲染
   ============================================================ */
const listEl = document.getElementById('list');
const tagbarEl = document.getElementById('tagbar');
const countEl = document.getElementById('count');
const qEl = document.getElementById('q');
const sortEl = document.getElementById('sort');
const resultEl = document.getElementById('result');
let activeTags = new Set();

function chip(text, on, extra=''){
  const el = document.createElement('span');
  el.className = 'chip ' + extra + (on ? ' on' : '');
  el.textContent = text;
  return el;
}
function renderTagbar(){
  const allTags = [...new Set(getAll().flatMap(p => p.tags))].sort();
  tagbarEl.innerHTML = '';
  const all = chip('全部', activeTags.size === 0, 'all');
  all.onclick = () => { activeTags.clear(); update(); };
  tagbarEl.appendChild(all);
  allTags.forEach(t => {
    const c = chip(t, activeTags.has(t));
    c.onclick = () => { activeTags.has(t) ? activeTags.delete(t) : activeTags.add(t); update(); };
    tagbarEl.appendChild(c);
  });
}
function resultClass(r){
  if(r === 'WA') return 'b-wa';
  if(r === 'TLE') return 'b-tle';
  return 'b-other';
}
function detailHTML(p){
  let h = '<div class="detail">';
  h += '<h3 class="sec">一、题目规则 / 核心考点</h3><ol>';
  (p.rules||[]).forEach(r => h += '<li>'+r+'</li>');
  h += '</ol>' + (p.rulesSummary ? '<p>'+p.rulesSummary+'</p>' : '');

  h += '<h3 class="sec">二、错误清单(按发现顺序)</h3>';
  (p.errors||[]).forEach((e,i) => {
    h += '<div class="err"><h4>❌ 错误 '+(i+1)+'｜'+e.title+'</h4><ul>';
    if(e.phenomenon)  h += '<li><b>现象</b>:'+e.phenomenon+'</li>';
    if(e.consequence) h += '<li><b>后果</b>:'+e.consequence+'</li>';
    if(e.cause)       h += '<li><b>根因</b>:'+e.cause+'</li>';
    if(e.fix)         h += '<li><span class="ok">✅ 正解</span>:'+e.fix+'</li>';
    h += '</ul></div>';
  });

  const rc = p.reviewCase || {};
  h += '<h3 class="sec">三、复盘用例</h3>';
  if(rc.input)      h += '<p>输入:</p><pre>'+rc.input+'</pre>';
  if(rc.key)        h += '<p>关键点:'+rc.key+'</p>';
  if(rc.output)     h += '<p>正确输出:</p><pre>'+rc.output+'</pre>';
  if(rc.waBehavior) h += '<p>WA 版本的表现:'+rc.waBehavior+'</p>';

  if((p.shortcomings||[]).length){
    h += '<h3 class="sec">四、暴露的思维 / 习惯短板</h3><table><tr><th>短板</th><th>这道题的表现</th></tr>';
    p.shortcomings.forEach(s => h += '<tr><td>'+s[0]+'</td><td>'+(s[1]||'')+'</td></tr>');
    h += '</table>';
  }
  if((p.checklist||[]).length){
    h += '<h3 class="sec">五、下次做同类题的检查清单</h3><ol>';
    p.checklist.forEach(c => h += '<li><span class="tag-step">'+c[0]+'</span>'+(c[1]||'')+'</li>');
    h += '</ol>';
  }
  if(p.oneLiner) h += '<h3 class="sec">六、一句话记住这道题</h3><div class="oneliner">'+p.oneLiner+'</div>';
  h += '</div>';
  return h;
}
function cardHTML(p, isUser){
  const tags = p.tags.map(t => '<span class="tag-s">'+t+'</span>').join('');
  return '<div class="card" data-id="'+p.id+'">'
    + '<div class="top"><h2>'+p.title+'</h2>'
    +   '<span class="badge '+resultClass(p.result)+'">'+p.result+'</span></div>'
    + '<div class="cmeta">📅 '+p.date+'　·　'+(p.source||'')+'</div>'
    + '<div class="tags">'+tags+'</div>'
    + (p.kidReflection ? '<div class="kidref"><span class="t">🧒 孩子的自我反思</span>'+p.kidReflection+'</div>' : '')
    + (p.comment ? '<div class="comment"><b>🎓 教练点评:</b>'+p.comment+'</div>' : '')
    + '<div class="cardfoot"><span class="toggle">▸ 展开详情</span>'
    +   (isUser ? '<span class="del" data-del="'+p.id+'">🗑 删除</span>' : '')
    + '</div>'
    + detailHTML(p)
    + '</div>';
}
function matches(p){
  if(activeTags.size > 0 && !p.tags.some(t => activeTags.has(t))) return false;
  const rf = resultEl.value;
  if(rf){
    if(rf === '其他'){ if(['WA','TLE','RE'].includes(p.result)) return false; }
    else if(p.result !== rf) return false;
  }
  const q = qEl.value.trim().toLowerCase();
  if(q){
    const blob = (p.title+' '+p.tags.join(' ')+' '+(p.comment||'')+' '+(p.source||'')+' '
      +(p.oneLiner||'')+' '+(p.errors||[]).map(e=>e.title+e.phenomenon+e.cause+e.fix).join(' ')).toLowerCase();
    if(!blob.includes(q)) return false;
  }
  return true;
}
function update(){
  renderTagbar();
  const extras = loadExtras();
  const userIds = new Set(extras.map(p => p.id));
  let items = getAll().filter(matches);
  items.sort((a,b) => sortEl.value === 'asc' ? a.date.localeCompare(b.date) : b.date.localeCompare(a.date));
  countEl.textContent = '共 ' + items.length + ' / ' + getAll().length + ' 题';
  if(items.length === 0){
    listEl.innerHTML = '<div class="empty">没有符合条件的题目,换个筛选试试~</div>';
    return;
  }
  listEl.innerHTML = items.map(p => cardHTML(p, userIds.has(p.id))).join('');
  listEl.querySelectorAll('.card').forEach(card => {
    const detail = card.querySelector('.detail');
    const toggle = card.querySelector('.toggle');
    const top = card.querySelector('.top');
    const flip = () => {
      const open = detail.classList.toggle('open');
      toggle.textContent = open ? '▾ 收起详情' : '▸ 展开详情';
    };
    toggle.onclick = flip;
    top.onclick = flip;
  });
  listEl.querySelectorAll('[data-del]').forEach(b => {
    b.onclick = (e) => {
      e.stopPropagation();
      const id = b.getAttribute('data-del');
      if(confirm('确定删除这道题?(只删本地新增的,种子题删不掉)')){
        saveExtras(loadExtras().filter(p => p.id !== id));
        update();
      }
    };
  });
}
qEl.oninput = update;
sortEl.onchange = update;
resultEl.onchange = update;

/* ============================================================
   录入错题:粘贴 AI 生成的 JSON(不再手填,由孩子先反思 + AI 判断整理)
   ============================================================ */
const $ = id => document.getElementById(id);

const mask = document.createElement('div');
mask.className = 'mask';
mask.innerHTML = `
  <div class="modal">
    <h2>📥 录入错题</h2>
    <div class="tip">
      正确姿势:① 让孩子<b>先自己总结</b>错在哪、为什么、下次怎么办 →
      ② 把「题目 + 代码 + 孩子的总结」发给 AI(可点顶部「🤖 AI 分析提示词」拿现成提示词)→
      ③ AI 会判断纠正并返回一段 JSON,把它粘到下面。
    </div>
    <div class="fld">
      <label>粘贴 AI 生成的题目 JSON <span class="hint">(一道题一个 {…};也可一次粘一个数组 [ … ])</span></label>
      <textarea id="f-json" style="min-height:300px;font-family:'SF Mono',Consolas,monospace;font-size:13px;line-height:1.5;" placeholder='{
  "title": "题目名(考点)",
  "tags": ["知识点1","知识点2"],
  "kidReflection": "孩子自己的总结(原话)",
  "comment": "教练点评",
  ...
}'></textarea>
    </div>
    <div class="actions">
      <button class="btn" id="cancelBtn">取消</button>
      <button class="btn primary" id="saveBtn">解析并加入错题库</button>
    </div>
  </div>`;
document.body.appendChild(mask);

function openModal(){ mask.classList.add('open'); $('f-json').value=''; $('f-json').focus(); }
function closeModal(){ mask.classList.remove('open'); }
$('cancelBtn').onclick = closeModal;
mask.onclick = e => { if(e.target === mask) closeModal(); };

$('saveBtn').onclick = () => {
  const raw = $('f-json').value.trim();
  if(!raw){ alert('先把 AI 生成的 JSON 粘进来'); return; }
  let parsed;
  try { parsed = JSON.parse(raw); }
  catch(err){ alert('JSON 解析失败,检查是否复制完整(含首尾的 { } 或 [ ]):\n\n' + err.message); return; }
  const arr = Array.isArray(parsed) ? parsed : [parsed];
  const extras = loadExtras();
  const have = new Set(getAll().map(p => p.id));
  let added = 0, skipped = 0;
  arr.forEach((p, k) => {
    if(!p || !p.title){ skipped++; return; }
    if(!p.id || have.has(p.id)) p.id = 'u' + new Date().getTime() + '_' + k;
    if(!p.date) p.date = new Date().toISOString().slice(0,10);
    if(!p.result) p.result = 'WA';
    if(!Array.isArray(p.tags)) p.tags = [];
    extras.push(p); have.add(p.id); added++;
  });
  saveExtras(extras); closeModal(); activeTags.clear(); update();
  alert('已加入 ' + added + ' 道题 ✅' + (skipped ? '(跳过 ' + skipped + ' 条没有 title 的)' : ''));
};
$('addBtn').onclick = openModal;

/* ============================================================
   导出 HTML(把 种子+本地新增 一起烤进新文件,可跨电脑)
   ============================================================ */
function download(filename, text){
  const blob = new Blob([text], {type:'text/html;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(a.href);
}
$('exportBtn').onclick = () => {
  const all = getAll();
  const clone = document.documentElement.cloneNode(true);
  // 用「全部题目」重写种子数据,并清掉运行时渲染的列表/弹窗
  clone.querySelector('#data').textContent =
    '\nconst SEED_PROBLEMS = ' + JSON.stringify(all, null, 2) + ';\n';
  const listNode = clone.querySelector('#list'); if(listNode) listNode.innerHTML = '';
  clone.querySelectorAll('.mask').forEach(m => m.remove());
  const html = '<!DOCTYPE html>\n' + clone.outerHTML;
  const stamp = new Date().toISOString().slice(0,10);
  download('编程错题库-' + stamp + '.html', html);
  alert('已导出:编程错题库-' + stamp + '.html\n\n这个文件里有全部 ' + all.length + ' 道题,\n拷到别的电脑打开,题目都在!');
};

/* ============================================================
   导入(从导出的 HTML 或 JSON 合并题目到本地)
   ============================================================ */
$('importBtn').onclick = () => document.getElementById('importFile').click();
document.getElementById('importFile').onchange = (e) => {
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    let imported = [];
    const txt = reader.result;
    try {
      if(file.name.endsWith('.json')){
        imported = JSON.parse(txt);
      } else {
        const m = txt.match(/const SEED_PROBLEMS\s*=\s*(\[[\s\S]*?\]);/);
        if(m) imported = eval(m[1]);
      }
    } catch(err){ alert('读取失败:' + err.message); return; }
    if(!Array.isArray(imported) || !imported.length){ alert('没读到题目'); return; }
    const seedIds = new Set(SEED_PROBLEMS.map(p=>p.id));
    const extras = loadExtras();
    const have = new Set(getAll().map(p=>p.id));
    let added = 0;
    imported.forEach(p => { if(!have.has(p.id) && !seedIds.has(p.id)){ extras.push(p); have.add(p.id); added++; } });
    saveExtras(extras); update();
    alert('导入完成,新增 ' + added + ' 道题(重复的已跳过)。');
  };
  reader.readAsText(file, 'utf-8');
  e.target.value = '';
};

/* ============================================================
   一键复制「给 AI 的提示词」—— 让大模型引导分析并输出可导入 JSON
   ============================================================ */
const AI_PROMPT = `你是一位耐心的编程竞赛教练,面对的是一名小学生/初中生。

- 我会给你【题目】【孩子写的代码】,以及【孩子自己的总结】(她自己说的:错在哪、为什么错、下次怎么办)。
