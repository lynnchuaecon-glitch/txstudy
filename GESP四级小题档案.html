<style>

  body{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--tx);

  header .m{color:var(--sub);font-size:14px;margin-top:3px;}

  .tab.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:700;}
  main{max-width:900px;margin:0 auto;padding:22px 26px;}
  .view{display:none;} .view.on{display:block;}
  h2{font-size:20px;margin:6px 0 12px;}
  h3{font-size:17.5px;color:var(--accent);margin:22px 0 8px;border-bottom:2px solid var(--bg3);padding-bottom:4px;}
  table{width:100%;border-collapse:collapse;margin:10px 0;font-size:15px;background:var(--bg2);}
  .table-scroll{overflow-x:auto;}
  .papers-table{min-width:1180px;}
  th,td{border:1px solid var(--line);padding:7px 9px;text-align:center;}
  th{background:var(--bg3);color:#fff;} td.l{text-align:left;}
  .goal{border:1px solid var(--accent);background:rgba(56,189,248,.1);border-radius:8px;padding:12px 16px;margin:12px 0;}
  .goal b{font-size:21px;color:var(--accent);}
  .pill{display:inline-block;font-size:12.5px;font-weight:700;padding:2px 9px;border-radius:11px;color:#0a0f1e;}
  .p-red{background:#f87171;} .p-org{background:#fbbf24;} .p-grn{background:#34d399;} .p-gray{background:#94a3b8;} .p-blue{background:#38bdf8;}

  .card.red{border-left-color:#f87171;} .card.org{border-left-color:#fbbf24;} .card.grn{border-left-color:#34d399;}
  .card h4{margin:0 0 8px;font-size:16.5px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;color:#fff;}
  .card-title{min-width:0;}
  .card-state{display:flex;align-items:center;gap:6px;flex:0 0 auto;}
  .kp{display:inline-block;font-size:11.5px;font-weight:800;padding:1px 8px;border-radius:4px;background:var(--accent2);color:#0a0f1e;margin-right:6px;vertical-align:middle;}
  .evidence{margin:9px 0 0;border-top:1px solid var(--line);padding-top:8px;color:var(--sub);font-size:13.5px;}
  .evidence summary{cursor:pointer;display:flex;align-items:center;gap:7px;width:max-content;max-width:100%;color:var(--sub);list-style:none;user-select:none;}
  .evidence summary::-webkit-details-marker{display:none;}
  .evidence summary::before{content:"▸";color:var(--accent);font-size:12px;transition:transform .15s ease;}
  .evidence[open] summary::before{transform:rotate(90deg);}
  .source-groups{display:grid;gap:6px;margin-top:8px;padding-left:19px;}
  .source-group{display:flex;align-items:flex-start;gap:10px;min-width:0;}
  .source-paper{color:var(--tx);font-weight:700;min-width:38px;}
  .source-questions{display:flex;gap:10px;flex-wrap:wrap;min-width:0;}
  .source-question{white-space:nowrap;}
  .source-question.wrong{color:#fca5a5;}
  .source-question.right{color:#6ee7b7;}
  .source-question.unknown{color:var(--sub);}
  .rule{background:rgba(52,211,153,.12);border-radius:5px;padding:6px 11px;margin:6px 0;}
  .trap{background:rgba(248,113,113,.12);border-radius:5px;padding:6px 11px;margin:6px 0;}

    font-family:"SF Mono",Consolas,monospace;font-size:13.5px;line-height:1.5;overflow-x:auto;margin:6px 0;white-space:pre-wrap;color:#cbd5e1;}
  code{font-family:"SF Mono",Consolas,monospace;background:var(--bg3);padding:1px 5px;border-radius:4px;font-size:14px;color:#e5e7eb;}
  .filters{margin:10px 0;display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .fbtn{border:1px solid var(--line);background:var(--bg2);color:var(--tx);border-radius:16px;padding:5px 13px;cursor:pointer;font-size:14px;font-family:inherit;}
  .fbtn.on{background:var(--accent);color:#0a0f1e;border-color:var(--accent);}
  .matrix td{font-size:14px;padding:6px;} .matrix td.blk{text-align:left;font-weight:700;background:var(--bg3);color:#fff;}
  .cell-bad{background:rgba(239,68,68,.42);color:#fff;font-weight:800;font-size:17px;}
  .cell-mid{background:rgba(245,158,11,.42);color:#fff8ec;font-weight:800;font-size:17px;}
  .cell-ok{background:rgba(34,197,120,.24);color:#7cf0b4;font-weight:700;font-size:17px;}
  .memo{font-size:16px;margin:5px 0;padding-left:6px;}
  .note{color:var(--sub);font-size:14px;}
  .legend{font-size:13.5px;color:var(--sub);margin:6px 0;display:flex;gap:12px;align-items:center;flex-wrap:wrap;}
  .printbar{margin:10px 0 4px;}
  .pbtn{background:var(--accent);color:#0a0f1e;border:none;border-radius:6px;padding:9px 18px;font-size:16px;cursor:pointer;font-family:inherit;font-weight:700;}
  ul.chk{list-style:none;padding-left:2px;} ul.chk li{margin:8px 0;font-size:16px;}
  ul.chk li::before{content:"☐ ";font-size:19px;color:var(--accent);font-weight:700;}

  @media(max-width:640px){
    main{padding:16px 14px;}
    .card h4{display:block;}
    .card-state{margin-top:7px;flex-wrap:wrap;}
    .source-group{display:block;}
    .source-paper{display:block;margin-bottom:2px;}
  }

  /* ===== 只有「考前速记」是浅色打印纸风格 ===== */
  #sprint{background:#fff;color:#1a1a1a;border-radius:10px;padding:20px 24px;margin-top:8px;box-shadow:0 0 0 1px var(--line);}
  #sprint h3{color:#1f5fa8;border-bottom:2px solid #e8f1fb;}
  #sprint .goal{border:2px solid #1f5fa8;background:#e8f1fb;}
  #sprint .goal b{color:#1f5fa8;}
  #sprint .note{color:#666;}
  #sprint b{color:#c0392b;}
  #sprint ul.chk li{color:#1a1a1a;}
  #sprint ul.chk li::before{color:#1f5fa8;}
  #sprint .pbtn{background:#1f5fa8;color:#fff;}

  @media print{
    header,.tabs,.noprint,.filters{display:none!important;}
    body{background:#fff;font-size:14px;}
    main{max-width:100%;padding:0;}
    .view{display:none!important;} .view.on{display:block!important;}
    #sprint{box-shadow:none;padding:0;}
    .goal,th,.pill,ul.chk li::before{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  }
</style>

const MISTAKES = [

    rule:"int *p 声明 p 保存整数地址；右边必须给地址，如 &a，不能直接给整数值 a。*p 则是在 p 已经指向某处后，访问那个地址里的值。",

    wrong:"2509·选2答对但标☆：知道 arr++ 错，却对“数组名在表达式中常退化成指针”和“数组名不是可修改的指针变量”之间的区别没有把握。",
    rule:"arr 在多数表达式中会转换成首元素地址，因此能写 arr+1；但 arr 不是一个能改值的指针变量，不能写 arr++。另定义 int *p=arr 后，p++ 才合法。",

    question:"比较 arr+1、arr++、p++：哪一个只计算新地址，哪两个试图修改自己？其中谁才是真正可修改的指针变量？"},

  { block:"指针", title:"指针可以「改指向」，*p 跟着换人",

    wrong:"以为 *p 永远等于最初绑定的变量；漏看后面 p=&别的 这一步改了指向。",

/* ============ 渲染 ============ */
const STATUS = { bad:["🔴 常错","p-red"], mid:["🟡 偶错","p-org"], ok:["🟢 已稳","p-grn"], na:["⚪ 待验证","p-gray"] };
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function rich(s){
  return esc(s)
    .replace(/&lt;(\/?)b&gt;/g,"<$1b>")
    .replace(/&amp;(gt|lt|amp);/g,"&$1;");
}
function srcStr(src){return src.map(x=>x[0]+"·"+x[1]).join("、");}
function sourceResult([paperId, question]){
  const paper=PAPERS.find(p=>p.id===paperId);
  const round=paper&&paper.rounds[paper.rounds.length-1];
  const n=Number(question.slice(1));
  if(!round||!n) return "unknown";
  if(question.startsWith("选")) return round.wrongPick.includes(n)?"wrong":"right";
  if(question.startsWith("判")){
    const wrong=String(round.wrongJudge).match(/\d+/g)||[];
    return wrong.map(Number).includes(n)?"wrong":"right";
  }
  return "unknown";
}
function sourceEvidence(src){
  const groups=[];
  src.forEach(item=>{
    let group=groups.find(g=>g.paper===item[0]);
    if(!group){group={paper:item[0],items:[]};groups.push(group);}
    group.items.push({question:item[1],result:sourceResult(item)});
  });
  const results=groups.flatMap(g=>g.items.map(item=>item.result));
  const wrong=results.filter(x=>x==="wrong").length;
  const right=results.filter(x=>x==="right").length;
  const known=wrong+right;
  const counts=[wrong?`<span class="source-question wrong">${wrong}错</span>`:"",right?`<span class="source-question right">${right}对</span>`:""].filter(Boolean).join(" ");
  const outcome=known?` · ${counts}`:"";
  const rows=groups.map(group=>`<div class="source-group">
    <span class="source-paper">${group.paper}</span>
    <span class="source-questions">${group.items.map(item=>`<span class="source-question ${item.result}">${item.question}${item.result==="wrong"?" · 错":item.result==="right"?" · 对":""}</span>`).join("")}</span>
  </div>`).join("");
  return `<details class="evidence"><summary>涉及 ${groups.length} 套卷 · ${src.length} 道题${outcome}</summary><div class="source-groups">${rows}</div></details>`;
}

// ① 仪表盘
function renderDash(){
  const lastP=PAPERS[PAPERS.length-1]; const latest=lastP.rounds[lastP.rounds.length-1];
  const delta=latest.score-35;
  // 矩阵：块 × 卷，单元格=该卷该块的错点数
  let cols=PAPERS.map(p=>`<th>${p.id}</th>`).join("");
  let rows=BLOCKS.map(b=>{
    let tds=PAPERS.map(p=>{
      const list=MISTAKES.filter(m=>m.block===b && m.src.some(s=>s[0]===p.id) && m.status!=="ok");
      if(list.length===0) return `<td class="cell-ok">—</td>`;
      const bad=list.some(m=>m.status==="bad");
      return `<td class="${bad?'cell-bad':'cell-mid'}">${list.length}</td>`;
    }).join("");
    return `<tr><td class="blk">${b}</td>${tds}</tr>`;
  }).join("");
  document.getElementById("dash").innerHTML=`
    <div class="goal">最近一卷（${lastP.id}）小题 <b>${latest.score} / 50</b>，
      目标 <b>35</b>，${delta>=0?`已超过 <b>${delta} 分</b>`:`缺口 <b>${-delta} 分 ≈ ${Math.ceil(-delta/2)} 题</b>`}。</div>
    <h3>最近一卷观察</h3>
    <p>${esc(latest.review||"暂无复习观察。")}</p>
    <h3>掌握度矩阵（数字＝该卷该块还在漏分的错点数）</h3>
    <table class="matrix"><tr><th>知识块＼卷</th>${cols}</tr>${rows}</table>
    <p class="legend"><span class="cell-bad" style="padding:3px 12px;border-radius:5px">红＝有常错</span>
      <span class="cell-mid" style="padding:3px 12px;border-radius:5px">橙＝偶错/待验证</span>
      <span class="cell-ok" style="padding:3px 12px;border-radius:5px">—　暂无漏分</span>
      <span style="color:var(--sub)">（数字＝该块还在漏分的错点数；看哪几行迟迟不消红，就是主攻方向）</span></p>
    <h3>分数趋势</h3>
    <table><tr><th>卷·轮</th><th>单选对</th><th>判断对</th><th>小题分</th><th>距35</th></tr>
    ${PAPERS.flatMap(p=>p.rounds.map(r=>
      `<tr><td>${p.id}·R${r.r}</td><td>${r.pickRight}/15</td><td>${r.judgeRight}/10</td>
       <td><b>${r.score}</b></td><td>${r.score>=35?"✅达标":"-"+(35-r.score)}</td></tr>`)).join("")}
    </table>`;
}

    const st=STATUS[m.status];
    const ev=m.selfEval?`<span class="pill" style="background:${EVAL[m.selfEval][1]};color:#fff">${EVAL[m.selfEval][0]}</span> `:"";
    return `<div class="card ${m.status==='bad'?'red':m.status==='mid'||m.status==='na'?'org':'grn'}">
      <h4><span class="card-title"><span class="kp">知识点</span>【${esc(m.block)}】${esc(m.title)}</span>
        <span class="card-state">${ev}<span class="pill ${st[1]}">${st[0]}</span></span></h4>
      <div class="trap">⚠️ 误区：${rich(m.wrong)}</div>
      <div class="rule">✅ 正确规则：${rich(m.rule)}</div>
      <pre>${esc(m.code)}</pre>
      ${sourceEvidence(m.src)}</div>`;
  }).join("");
  document.getElementById("lib").innerHTML=`
    <div class="filters">
      ${fb("all","全部 "+MISTAKES.length)}
      ${fb("bad","🔴 常错 "+cnt("bad"))}
      ${fb("mid","🟡 偶错 "+cnt("mid"))}
      ${fb("na","⚪ 待验证 "+cnt("na"))}
      ${fb("ok","🟢 已稳 "+cnt("ok"))}
    </div>${cards}`;
}

// ③ 考前速记（只 🔴🟡⚪，按块分组，打印这个）
function renderSprint(){
  const active=MISTAKES.filter(m=>m.status!=="ok");
  let sec=BLOCKS.map(b=>{
    const items=active.filter(m=>m.block===b);
    if(!items.length) return "";
    return `<h3>${b}</h3><ul class="chk">`+items.map(m=>
      `<li>${m.memo}　<span class="note">(${srcStr(m.src)})</span></li>`).join("")+`</ul>`;
  }).join("");
  document.getElementById("sprint").innerHTML=`
    <div class="printbar noprint"><button class="pbtn" onclick="window.print()">🖨 打印考前速记</button>
      <span class="note">　打印时自动只印这一页</span></div>
    <div class="goal">考前一天，把下面每条读一遍、勾一遍。只列还没稳的点（🟢已稳的不再占版面）。</div>
    ${sec}
    <p class="note">共 ${active.length} 条待巩固 · 随着一卷卷做，转绿的会自动从这里消失。</p>`;
}

// ④ 各卷记录
function renderPapers(){
  const nums=a=>(a&&a.length?a.join("、"):"—");
  let rows=PAPERS.map(p=>p.rounds.map(r=>
    `<tr><td>${p.id} ${p.name}</td><td>R${r.r}</td><td>${r.date}</td>
     <td>${r.pickRight}/15</td><td>${r.judgeRight}/10</td><td><b>${r.score}</b></td>
     <td class="l">错选:${r.wrongPick.join(",")}<br>错判:${r.wrongJudge}</td>
     <td class="l">☆ 选${nums(r.unsurePick)}／判${nums(r.unsureJudge)}<br>△ 选${nums(r.confusedPick)}／判${nums(r.confusedJudge)}</td>
     <td class="l">${r.review||"—"}</td></tr>`).join("")).join("");
  document.getElementById("papers").innerHTML=`
    <p class="note">过程数据：每卷每轮的得分和错题号。平时不用看，用来追踪「同一卷第2轮有没有进步」。</p>
    <div class="table-scroll"><table class="papers-table"><tr><th>卷</th><th>轮</th><th>日期</th><th>单选</th><th>判断</th><th>小题分</th><th class="l">错题号</th><th class="l">自评标记</th><th class="l">复习观察</th></tr>${rows}</table></div>
    <p class="note">共 ${PAPERS.length} 卷已录入（计划约 11 卷 × 3~4 轮）。</p>`;
}

// tab 切换
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("on"));
  document.querySelectorAll(".view").forEach(x=>x.classList.remove("on"));
  t.classList.add("on");
  document.getElementById(t.dataset.v).classList.add("on");
});

renderDash();renderLib();renderSprint();renderPapers();
</script>
</body>
</html>
