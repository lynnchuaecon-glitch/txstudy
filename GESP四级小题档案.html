<style>

  header h1{margin:0;font-size:22px;color:#fff;}
  header .m{color:var(--sub);font-size:14px;margin-top:3px;}
  .tabs{display:flex;gap:4px;background:var(--bg2);padding:0 20px;position:sticky;top:0;z-index:10;flex-wrap:wrap;border-bottom:1px solid var(--line);}

  main{max-width:900px;margin:0 auto;padding:22px 26px;}
  .view{display:none;} .view.on{display:block;}
  h2{font-size:20px;margin:6px 0 12px;}

  .pill{display:inline-block;font-size:12.5px;font-weight:700;padding:2px 9px;border-radius:11px;color:#0a0f1e;}
  .p-red{background:#f87171;} .p-org{background:#fbbf24;} .p-grn{background:#34d399;} .p-gray{background:#94a3b8;} .p-blue{background:#38bdf8;}
  .card{background:var(--bg2);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:7px;padding:12px 15px;margin:12px 0;page-break-inside:avoid;}
  .card.red{border-left-color:#f87171;} .card.org{border-left-color:#fbbf24;} .card.grn{border-left-color:#34d399;}
  .card h4{margin:0 0 4px;font-size:16.5px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;color:#fff;}
  .src{font-size:12.5px;color:var(--sub);font-weight:400;}
  .kp{display:inline-block;font-size:11.5px;font-weight:800;padding:1px 8px;border-radius:4px;background:var(--accent2);color:#0a0f1e;margin-right:6px;vertical-align:middle;}
  .rule{background:rgba(52,211,153,.12);border-radius:5px;padding:6px 11px;margin:6px 0;}
  .trap{background:rgba(248,113,113,.12);border-radius:5px;padding:6px 11px;margin:6px 0;}
  pre{background:#0d1424;border:1px solid var(--line);border-radius:5px;padding:8px 11px;
    font-family:"SF Mono",Consolas,monospace;font-size:13.5px;line-height:1.5;overflow-x:auto;margin:6px 0;white-space:pre-wrap;color:#cbd5e1;}
  code{font-family:"SF Mono",Consolas,monospace;background:var(--bg3);padding:1px 5px;border-radius:4px;font-size:14px;color:#e5e7eb;}
  .filters{margin:10px 0;display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .fbtn{border:1px solid var(--line);background:var(--bg2);color:var(--tx);border-radius:16px;padding:5px 13px;cursor:pointer;font-size:14px;font-family:inherit;}
  .fbtn.on{background:var(--accent);color:#0a0f1e;border-color:var(--accent);}
  .matrix td{font-size:14px;padding:6px;} .matrix td.blk{text-align:left;font-weight:700;background:var(--bg3);color:#fff;}
  .cell-bad{background:rgba(239,68,68,.42);color:#fff;font-weight:800;font-size:17px;}
  .cell-mid{background:rgba(245,158,11,.42);color:#fff8ec;font-weight:800;font-size:17px;}
  .cell-ok{background:rgba(34,197,120,.24);color:#7cf0b4;font-weight:700;font-size:17px;}
  .memo{font-size:16px;margin:5px 0;padding-left:6px;}
  .note{color:var(--sub);font-size:14px;}
  .legend{font-size:13.5px;color:var(--sub);margin:6px 0;display:flex;gap:12px;align-items:center;flex-wrap:wrap;}
  .printbar{margin:10px 0 4px;}
  .pbtn{background:var(--accent);color:#0a0f1e;border:none;border-radius:6px;padding:9px 18px;font-size:16px;cursor:pointer;font-family:inherit;font-weight:700;}
  ul.chk{list-style:none;padding-left:2px;} ul.chk li{margin:8px 0;font-size:16px;}
  ul.chk li::before{content:"☐ ";font-size:19px;color:var(--accent);font-weight:700;}

  /* ===== 只有「考前速记」是浅色打印纸风格 ===== */
  #sprint{background:#fff;color:#1a1a1a;border-radius:10px;padding:20px 24px;margin-top:8px;box-shadow:0 0 0 1px var(--line);}
  #sprint h3{color:#1f5fa8;border-bottom:2px solid #e8f1fb;}
  #sprint .goal{border:2px solid #1f5fa8;background:#e8f1fb;}
  #sprint .goal b{color:#1f5fa8;}
  #sprint .note{color:#666;}
  #sprint b{color:#c0392b;}
  #sprint ul.chk li{color:#1a1a1a;}
  #sprint ul.chk li::before{color:#1f5fa8;}
  #sprint .pbtn{background:#1f5fa8;color:#fff;}

  @media print{
    header,.tabs,.noprint,.filters{display:none!important;}
    body{background:#fff;font-size:14px;}
    main{max-width:100%;padding:0;}
    .view{display:none!important;} .view.on{display:block!important;}
    #sprint{box-shadow:none;padding:0;}
    .goal,th,.pill,ul.chk li::before{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  }

    question:"第5题（执行后 *p 的值是？）\nint lv=5, next_lv=6;\nint *p=&lv;\n*p=*p+1;\np=&next_lv;\n// A.5  B.6  C.lv的地址  D.next_lv的地址\n→ 正确答案 B"},

  { block:"指针", title:"指针 ±1 = 走一个「元素格子」",

    question:"第7题（变量 val 的值是？）\nint data[]={10,20,30,40,50};\nint *ptr=data+2;\nint val=*(ptr-1)+*(ptr+1);\n// A.50  B.60  C.70  D.80\n→ 正确答案 B"},

  { block:"指针", title:"&整个数组 +1 跳过一整块（难）",
    src:[["2606","选6"]], status:"mid", selfEval:"懵",
    wrong:"以为 &map+1 只加一个元素/一个字节。",
    rule:"&数组名 +1 会跳过整个数组的字节数 = 行×列×每格字节；再换成16进制加上去。",
    memo:"&数组+1 跳<b>整块</b>（行×列×字节）",
    code:"int map[5][4];  // 一整块=5×4×4=80字节=0x50\n// 起始 0x2000 → &map+1 = 0x2050",
    question:"第6题（int 占4字节，map 起址 0x2000，&map+1 的地址？）\nint map[5][4];\n// A.0x204c  B.0x205c  C.0x2050  D.0x2058\n→ 正确答案 C"},

  { block:"结构体", title:"new 出来的是「指针」，左边必须带 *",
    src:[["2606","选9"]], status:"mid", selfEval:"没把握",
    wrong:"以为 Hero h = new Hero{...} 合法。（☆自评「会」，其实栽了）",
    rule:"new 返回的一定是指针，左边必须是 Hero*。左边写成普通对象 Hero h 就编译错。",
    memo:"new 出来是<b>指针</b>，左边带 *",
    code:"Hero h  = new Hero{...};  // ✗ 编译错\nHero *p = new Hero{...};  // ✓ 指针接指针",
    question:"第9题（哪种初始化会语法错误导致编译失败？）\nstruct Hero{ string name; int hp; };\nA. Hero h = {\"Arthur\",100};\nB. Hero h; h.name=\"Arthur\"; h.hp=100;\nC. Hero h = new Hero{\"Arthur\",100};\nD. Hero *p = new Hero{\"Arthur\",100};\n→ 正确答案 C"},

  { block:"排序", title:"冒泡稳定、插入稳定、选择排序不稳定",
    src:[["2606","选11"],["2606","判4"]], status:"bad", selfEval:"没把握",
    wrong:"以为选择排序也是稳定的。（☆自评「会」，其实栽了）",
    rule:"选择排序把最小元素直接拎到前面，会跳过和它相等的元素，打乱相对顺序 → 不稳定。",
    memo:"<b>选择排序不稳定</b>（冒泡/插入稳定）",
    code:"[5a, 5b, 2] → 选最小 2 换到第1位\n[2, 5b, 5a] → 5a 跑到 5b 后，顺序变了",
    question:"第11题（关于排序稳定性，错误的说法是？）\nA. 冒泡稳定，只有左>右才交换\nB. 插入稳定，插到相等元素右侧\nC. 选择排序稳定，每次选最小放前面\nD. 稳定=排序后相等元素相对位置不变\n→ 正确答案 C（选择排序其实不稳定）\n判4：选择排序遇相等不交换则稳定 → 错（×）"},

  { block:"排序", title:"认代码：一轮找最小位置再交换 = 选择排序",
    src:[["2606","选14"]], status:"bad",
    wrong:"看到排序代码认不出是哪种。",
    rule:"特征：外层每一轮先找出最小值的位置 minPos，一轮只交换一次 → 选择排序。",
    memo:"找 minPos 再换一次 = <b>选择排序</b>",
    code:"for(i..) { minPos=i;\n  for(j=i+1..) if(a[j]<a[minPos]) minPos=j;\n  swap(a[i], a[minPos]); }  // 选择排序",
    question:"第14题（下面代码用的是哪种排序？）\nvoid mystery_sort(double arr[], int n){\n  for(int i=0;i<n-1;i++){\n    int minPos=i;\n    for(int j=i+1;j<n;j++)\n      if(arr[j]<arr[minPos]) minPos=j;\n    swap(arr[i],arr[minPos]);\n  }\n}\n// A.冒泡 B.插入 C.选择 D.非典型\n→ 正确答案 C"},

  { block:"递推", title:"循环里变量互相赋值 → 一律画表格手算",
    src:[["2606","选12"]], status:"mid",
    wrong:"心算迭代过程，a/b/c 更新顺序算乱。",
    rule:"凡是循环里 c=a+b; a=b; b=c 这种，别心算，列表格一行行填到底。这是全卷通用救命技能。",
    memo:"循环迭代 <b>画表格</b>手算，不心算",
    code:"a=1,b=2\ni=3: c=3, a=2, b=3\ni=4: c=5, a=3, b=5\ni=5: c=8   → 答案 8",
    question:"第12题（jump(5) 的结果？f(n)=f(n-1)+f(n-2), f(1)=1,f(2)=2）\nint jump(int n){\n  if(n<=2) return n;\n  int a=1,b=2,c=0;\n  for(int i=3;i<=n;i++){ c=a+b; a=b; b=c; }\n  return c;\n}\n// A.5  B.8  C.13  D.21\n→ 正确答案 B"},

  { block:"异常处理", title:"throw 的类型 决定被哪个 catch 接住",
    src:[["2606","选13"]], status:"bad", selfEval:"懵",
    wrong:"完全没认出这是异常处理题（考试写了「我也不知道」）——概念空白。",
    rule:"throw 抛出什么类型，就被对应类型的 catch 接住，其它 catch 跳过。\"文字\" 是字符串(const char*)，不是 int。",
    memo:"throw 什么<b>类型</b>被对应 catch 接；\"字\"≠int",
    code:"throw \"Zero Error\";       // 抛的是字符串\ncatch(int e){...}         // 类型不符，跳过\ncatch(const char* m){...}  // 接住 → 选 C",
    question:"第13题（执行以下代码将输出？）\ntry{\n  int x=10, y=0;\n  if(y==0) throw \"Zero Error\";\n  cout<<x/y;\n} catch(int e){\n  cout<<\"Error Code: \"<<e;\n} catch(const char* msg){\n  cout<<\"Caught: \"<<msg;\n}\n// A.0  B.Error Code: 0  C.Caught: Zero Error  D.崩溃\n→ 正确答案 C"},

  { block:"函数·作用域·传参", title:"值传递 vs 传址/引用（送分点，务必吃透）",
    src:[["2606","选1"],["2606","判1"],["2606","判9"]], status:"mid", selfEval:"懵",
    wrong:"分不清参数写 int x / int *p / int &x 时，能不能改到外面的变量。（选1△懵蒙对，别被'对了'骗了）",
    rule:"参数光是普通值 → 改不到外面；带 * 或 & → 能改到外面。这是四级最爱考的送分点。",

  { block:"函数·作用域·传参", title:"引用不能改绑；数组名不能 ++",
    src:[["2606","判2"],["2606","判10"]], status:"na",

    memo:"引用<b>不能改绑</b>；数组名<b>不能 ++</b>",
    code:"int a[5];\na++;   // ✗ 编译错",
    question:"判2：引用初始化并绑定后，可用赋值语句重新绑定到另一变量 →（正确答案 ×）\n判10：int a[5]; a++; 可以通过编译 →（正确答案 ×）"},

  { block:"函数·作用域·传参", title:"局部变量出了函数就失效（作用域）",
    src:[["2606","选4"]], status:"na", selfEval:"没把握",
    wrong:"这题☆自评「会但没把握」——虽做对，仍是脆弱点，考前要再过一遍确认真会。",
    rule:"函数里定义的变量只在这个函数内有效，出了这个函数用它 → 编译错。",

    wrong:"这题☆「会但没把握」——做对但没底，脆弱点，考前再确认下标。",

/* ============ 渲染 ============ */
const STATUS = { bad:["🔴 常错","p-red"], mid:["🟡 偶错","p-org"], ok:["🟢 已稳","p-grn"], na:["⚪ 待验证","p-gray"] };
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function srcStr(src){return src.map(x=>x[0]+"·"+x[1]).join("、");}

// ① 仪表盘
function renderDash(){
  const latest=PAPERS[0].rounds[PAPERS[0].rounds.length-1];
  // 矩阵：块 × 卷，单元格=该卷该块的错点数
  let cols=PAPERS.map(p=>`<th>${p.id}</th>`).join("");
  let rows=BLOCKS.map(b=>{
    let tds=PAPERS.map(p=>{
      const list=MISTAKES.filter(m=>m.block===b && m.src.some(s=>s[0]===p.id) && m.status!=="ok");
      if(list.length===0) return `<td class="cell-ok">—</td>`;
      const bad=list.some(m=>m.status==="bad");
      return `<td class="${bad?'cell-bad':'cell-mid'}">${list.length}</td>`;
    }).join("");
    return `<tr><td class="blk">${b}</td>${tds}</tr>`;
  }).join("");
  document.getElementById("dash").innerHTML=`
    <div class="goal">最近一卷（${PAPERS[0].id}）小题 <b>${latest.score} / 50</b>，
      目标 <b>35</b>，缺口 <b>${35-latest.score} 分 ≈ ${Math.ceil((35-latest.score)/2)} 题</b>。</div>
    <h3>掌握度矩阵（数字＝该卷该块还在漏分的错点数）</h3>
    <table class="matrix"><tr><th>知识块＼卷</th>${cols}</tr>${rows}</table>
    <p class="legend"><span class="cell-bad" style="padding:3px 12px;border-radius:5px">红＝有常错</span>
      <span class="cell-mid" style="padding:3px 12px;border-radius:5px">橙＝偶错/待验证</span>
      <span class="cell-ok" style="padding:3px 12px;border-radius:5px">—　暂无漏分</span>
      <span style="color:var(--sub)">（数字＝该块还在漏分的错点数；看哪几行迟迟不消红，就是主攻方向）</span></p>
    <h3>分数趋势</h3>
    <table><tr><th>卷·轮</th><th>单选对</th><th>判断对</th><th>小题分</th><th>距35</th></tr>
    ${PAPERS.flatMap(p=>p.rounds.map(r=>
      `<tr><td>${p.id}·R${r.r}</td><td>${r.pickRight}/15</td><td>${r.judgeRight}/10</td>
       <td><b>${r.score}</b></td><td>${r.score>=35?"✅达标":"-"+(35-r.score)}</td></tr>`)).join("")}
    </table>`;
}

// ② 知识档案
let curFilter="all";
function renderLib(){
  const order={bad:0,na:1,mid:2,ok:3};
  const list=MISTAKES.filter(m=>curFilter==="all"||m.status===curFilter)
    .sort((a,b)=>(BLOCKS.indexOf(a.block)-BLOCKS.indexOf(b.block))||(order[a.status]-order[b.status]));
  const cnt=k=>MISTAKES.filter(m=>m.status===k).length;
  const fb=(k,label)=>`<button class="fbtn ${curFilter===k?"on":""}" onclick="curFilter='${k}';renderLib()">${label}</button>`;
  const EVAL={ "懵":["🌀 当时懵·蒙的","#ef3b30"], "没把握":["〰️ 会但没把握","#f0850a"] };
  let cards=list.map(m=>{
    const st=STATUS[m.status];
    const ev=m.selfEval?`<span class="pill" style="background:${EVAL[m.selfEval][1]};color:#fff">${EVAL[m.selfEval][0]}</span> `:"";
    return `<div class="card ${m.status==='bad'?'red':m.status==='mid'||m.status==='na'?'org':'grn'}">
      <h4><span><span class="kp">知识点</span>【${m.block}】${m.title}</span>
        <span>${ev}<span class="pill ${st[1]}">${st[0]}</span> <span class="src">来源：${srcStr(m.src)}</span></span></h4>
      <div class="trap">⚠️ 误区：${m.wrong}</div>
      <div class="rule">✅ 正确规则：${m.rule}</div>
      <pre>${esc(m.code)}</pre></div>`;
  }).join("");
  document.getElementById("lib").innerHTML=`
    <div class="filters">
      ${fb("all","全部 "+MISTAKES.length)}
      ${fb("bad","🔴 常错 "+cnt("bad"))}
      ${fb("mid","🟡 偶错 "+cnt("mid"))}
      ${fb("na","⚪ 待验证 "+cnt("na"))}
      ${fb("ok","🟢 已稳 "+cnt("ok"))}
    </div>${cards}`;
}

// ③ 考前速记（只 🔴🟡⚪，按块分组，打印这个）
function renderSprint(){
  const active=MISTAKES.filter(m=>m.status!=="ok");
  let sec=BLOCKS.map(b=>{
    const items=active.filter(m=>m.block===b);
    if(!items.length) return "";
    return `<h3>${b}</h3><ul class="chk">`+items.map(m=>
      `<li>${m.memo}　<span class="note">(${srcStr(m.src)})</span></li>`).join("")+`</ul>`;
  }).join("");
  document.getElementById("sprint").innerHTML=`
    <div class="printbar noprint"><button class="pbtn" onclick="window.print()">🖨 打印考前速记</button>
      <span class="note">　打印时自动只印这一页</span></div>
    <div class="goal">考前一天，把下面每条读一遍、勾一遍。只列还没稳的点（🟢已稳的不再占版面）。</div>
    ${sec}
    <p class="note">共 ${active.length} 条待巩固 · 随着一卷卷做，转绿的会自动从这里消失。</p>`;
}

// ④ 各卷记录
function renderPapers(){
  let rows=PAPERS.map(p=>p.rounds.map(r=>
    `<tr><td>${p.id} ${p.name}</td><td>R${r.r}</td><td>${r.date}</td>
     <td>${r.pickRight}/15</td><td>${r.judgeRight}/10</td><td><b>${r.score}</b></td>
     <td class="l">错选:${r.wrongPick.join(",")}<br>错判:${r.wrongJudge}</td></tr>`).join("")).join("");
  document.getElementById("papers").innerHTML=`
    <p class="note">过程数据：每卷每轮的得分和错题号。平时不用看，用来追踪「同一卷第2轮有没有进步」。</p>
    <table><tr><th>卷</th><th>轮</th><th>日期</th><th>单选</th><th>判断</th><th>小题分</th><th class="l">错题号</th></tr>${rows}</table>
    <p class="note">共 ${PAPERS.length} 卷已录入（计划约 11 卷 × 3~4 轮）。</p>`;
}

// tab 切换
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("on"));
  document.querySelectorAll(".view").forEach(x=>x.classList.remove("on"));
  t.classList.add("on");
  document.getElementById(t.dataset.v).classList.add("on");
});

renderDash();renderLib();renderSprint();renderPapers();
</script>
</body>
</html>
